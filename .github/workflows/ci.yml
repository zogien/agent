name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  binding-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -X warn_default_encoding -W error::EncodingWarning scripts/check_binding_parity.py
      - run: python3 -X warn_default_encoding -W error::EncodingWarning -m unittest scripts.tests.test_binding_parity

  sdk:
    name: Build SDK (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu
          - runner: macos-latest
            target: aarch64-macos
          - runner: windows-latest
            target: x86_64-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Build SDK archive
        run: zig build archive -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
      - run: npm ci --prefix sdk/node --ignore-scripts
      - name: Build and test the native Node binding
        env:
          METACODES_NODE_SDK_REQUIRE_LIB: '1'
        run: |
          node sdk/node/scripts/build.js --target ${{ matrix.target }} --artifact zig-out/node-addons
          node --test sdk/node/test/metacodes.test.js
