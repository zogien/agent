name: Release

on:
  push:
    tags: ["fork/v*-fork.*"]

permissions:
  contents: read

jobs:
  agentcore:
    if: ${{ !github.event.deleted }}
    name: AgentCore (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu
          - runner: macos-latest
            target: aarch64-macos
          - runner: macos-15-intel
            target: x86_64-macos
          - runner: windows-latest
            target: x86_64-windows-msvc
          - runner: windows-11-arm
            target: aarch64-windows-msvc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Build AgentCore archive
        run: zig build agentcore:archive -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentcore-${{ matrix.target }}
          path: zig-out/agentcore-archives/
          if-no-files-found: error

  publish:
    needs: agentcore
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agentcore-*
          merge-multiple: true
          path: dist
      - name: Publish AgentCore archives
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --notes "" dist/*

  pack-npm:
    name: Pack and verify Agent SDK npm packages
    needs: agentcore
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agentcore-*
          merge-multiple: true
          path: ${{ runner.temp }}/agentcore-archives
      - name: Check npm release retry behavior
        run: node --test scripts/npm/publish-release.test.mjs
      - name: Pack and install-check the seven tarballs
        run: >-
          node scripts/npm/pack-release.mjs
          "$RUNNER_TEMP/agentcore-archives" "$GITHUB_REF_NAME"
          "$(git rev-parse HEAD)" "$RUNNER_TEMP/agentcore-npm"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/agentcore-npm/
          if-no-files-found: error

  publish-npm:
    name: Publish Agent SDK to npm
    if: github.repository == 'zogien/agent'
    needs: [publish, pack-npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: agentcore-npm-publish
      queue: max
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/agentcore-npm
      - name: Publish platform packages, then the main package
        run: >-
          node scripts/npm/publish-release.mjs
          "$RUNNER_TEMP/agentcore-npm" "$GITHUB_REF_NAME"
