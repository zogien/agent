name: Release

on:
  push:
    tags: ["fork/*-fork.*"]

permissions:
  contents: read

jobs:
  agentcore:
    if: ${{ !github.event.deleted }}
    name: AgentCore (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu
          - runner: macos-latest
            target: aarch64-macos
          - runner: macos-15-intel
            target: x86_64-macos
          - runner: windows-latest
            target: x86_64-windows-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Build AgentCore archive
        run: zig build agentcore:archive -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentcore-${{ matrix.target }}
          path: zig-out/agentcore-archives/
          if-no-files-found: error

  publish:
    needs: agentcore
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agentcore-*
          merge-multiple: true
          path: dist
      - name: Publish AgentCore archives
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --notes "" dist/*
